# Keeps the stack in step with the ecosystem. Each update arrives as a PR, and CI on that PR is the check.
# Rationale: docs/adrs/0001-pinned-toolchain-and-dependabot.md
version: 2
updates:
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-compatible:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Generated by cargo-dist; hand edits make `dist plan` fail. Update it by bumping
    # `cargo-dist-version` in Cargo.toml and re-running `dist init`.
    exclude-paths:
      - .github/workflows/release.yml
    groups:
      github-actions:
        patterns: ["*"]
